<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine?</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffe6eb;
      text-align: center;
      padding-top: 100px;
    }
    h1 {
      font-size: 2.5rem;
    }
    button {
      font-size: 1.2rem;
      padding: 10px 20px;
      margin: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    #yes {
      background-color: #ff4d6d;
      color: white;
    }
    #no {
      background-color: #ccc;
      position: absolute;
    }
  </style>
</head>
<body>

  <h1>Will you be my Valentine? 💘</h1>
  <p>(No pressure… but also yes pressure)</p>

  <button id="yes" onclick="yesClicked()">Yes 💕</button>
  <button id="no" onmouseover="moveNo()">No 🙃</button>

  <script>
    function yesClicked() {
      document.body.innerHTML = "<h1>YAY ❤️ I can’t wait 💌</h1><p>Love you.</p>";
    }

    function moveNo() {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      const noBtn = document.getElementById("no");
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }
  </script>

</body>
</html>
